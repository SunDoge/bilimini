[package]
name = "bilimini-plico"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[features]
default = ["skia"]
skia = ["plico-vello/skia"]

[dependencies]
bili-core = { path = "../core" }
plico-core = { path = "../../../projects/plico/crates/plico-core" }
plico-vello = { path = "../../../projects/plico/crates/plico-vello", default-features = false }
plico-renderer = { path = "../../../projects/plico/crates/plico-renderer" }
plico-shell = { path = "../../../projects/plico/crates/plico-shell" }
plico-video = { path = "../../../projects/plico/crates/plico-video", features = ["mpv"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
usage-rs = "7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
