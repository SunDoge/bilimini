[package]
name = "bilimini-plico"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[features]
default = ["skia"]
skia = ["plico-vello/skia"]

[dependencies]
bili-core = { path = "../core" }
plico-core = { git = "https://github.com/SunDoge/plico", rev = "a357a65d55e3f0acde1a8ed66f6d9fe532362e06" }
plico-vello = { git = "https://github.com/SunDoge/plico", rev = "a357a65d55e3f0acde1a8ed66f6d9fe532362e06", default-features = false }
plico-renderer = { git = "https://github.com/SunDoge/plico", rev = "a357a65d55e3f0acde1a8ed66f6d9fe532362e06" }
plico-shell = { git = "https://github.com/SunDoge/plico", rev = "a357a65d55e3f0acde1a8ed66f6d9fe532362e06" }
plico-video = { git = "https://github.com/SunDoge/plico", rev = "a357a65d55e3f0acde1a8ed66f6d9fe532362e06", features = ["mpv"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
usage-rs = "7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
